services:
  - type: web
    name: online-dress-mart
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
